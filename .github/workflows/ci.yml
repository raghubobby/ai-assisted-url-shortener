name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven verify (unit + H2 + PostgreSQL/Redis Testcontainers)
        run: mvn -B clean verify

      - name: Security baseline
        run: ./scripts/security-baseline.sh

      - name: Git diff hygiene
        run: git diff --check

      - name: Validate Compose files
        run: |
          docker compose config >/dev/null
          docker compose -f docker-compose.single.yml config >/dev/null

      - name: Build application image
        run: docker build -f Dockerfile.url-shortener -t shortpath:ci .
